<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cabañas Gil | Mazamitla: Eventos, Aventura y Descanso</title>

    <!-- Fuentes y Librerías Externas Corregidas -->
    <link href="https://googleapis.com" rel="stylesheet">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cloudflare.com">

    <style>
        /* VARIABLES DE DISEÑO PREMIUM (BOSQUE Y NATURALEZA) */
        :root {
            --forest-dark: #111b15;
            --forest-mid: #1c2e24;
            --forest-light: #2d4538;
            --gold: #d4af37;
            --gold-hover: #f3cf65;
            --light-bg: #fcfaf7;
            --wood-clear: #f4ede4;
            --text-dark: #1c2621;
            --text-light: #f5f7f6;
            --shadow-subtle: 0 15px 35px rgba(17, 27, 21, 0.05);
            --shadow-strong: 0 20px 40px rgba(0, 0, 0, 0.3);
        }

        /* CONFIGURACIÓN GENERAL */
        body {
            font-family: 'Raleway', sans-serif;
            margin: 0;
            background-color: var(--light-bg);
            color: var(--text-dark);
            overflow-x: hidden;
            scroll-behavior: smooth;
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: auto;
            padding: 100px 20px;
        }

        h1, h2, h3 {
            font-family: 'Playfair Display', serif;
            font-weight: 700;
        }

        h2 {
            font-size: clamp(2.3rem, 5vw, 3.5rem);
            text-align: center;
            margin-bottom: 50px;
            position: relative;
            color: var(--forest-dark);
        }

        h2::after {
            content: '🌲';
            display: block;
            font-size: 1.2rem;
            margin-top: 10px;
            color: var(--gold);
            opacity: 0.7;
        }

        /* HERO - BANNER PRINCIPAL (FULL SCREEN) */
        header.hero-principal {
            background: linear-gradient(rgba(17, 27, 21, 0.5), rgba(17, 27, 21, 0.75)), url('Fachada.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            text-align: center;
            position: relative;
            padding: 0 20px;
        }

        .logo-premium {
            width: 160px;
            margin-bottom: 25px;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.2));
            transition: transform 0.4s;
        }

        .logo-premium:hover {
            transform: scale(1.05);
        }

        h1 {
            font-size: clamp(3rem, 8vw, 5.5rem);
            margin: 0;
            text-shadow: 0 4px 20px rgba(0,0,0,0.4);
            letter-spacing: -1px;
            line-height: 1.1;
        }

        .hero-sub {
            font-size: clamp(0.9rem, 2vw, 1.2rem);
            letter-spacing: 6px;
            text-transform: uppercase;
            margin-top: 15px;
            font-weight: 300;
            color: var(--gold);
            text-shadow: 0 2px 10px rgba(0,0,0,0.3);
        }

        /* Indicador de Scroll */
        .scroll-indicator {
            position: absolute;
            bottom: 30px;
            color: white;
            font-size: 1.5rem;
            animation: bounce 2s infinite;
            transition: opacity 0.4s ease, visibility 0.4s;
            cursor: pointer;
            z-index: 10;
        }

        .scroll-indicator i {
            color: var(--gold);
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-10px); }
            60% { transform: translateY(-5px); }
        }

        /* SECCIÓN CABAÑAS (ESTILO BOSQUE SOFISTICADO) */
        .cabanas-section {
            background-color: var(--forest-dark);
            background-image: radial-gradient(rgba(45, 69, 56, 0.15) 1px, transparent 0);
            background-size: 24px 24px;
            padding: 120px 0;
            border-radius: 60px 60px 0 0;
            color: var(--text-light);
        }

        .cabanas-section h2 {
            color: var(--text-light);
        }

        .cabana-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(214, 175, 55, 0.15);
            border-radius: 24px;
            margin-bottom: 60px;
            overflow: hidden;
            transition: transform 0.4s, border-color 0.4s, box-shadow 0.4s;
        }

        .cabana-card:hover {
            transform: translateY(-5px);
            border-color: var(--gold);
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
            background: rgba(255, 255, 255, 0.04);
        }

        .cabana-header {
            padding: 50px 40px 30px;
            text-align: center;
        }

        .cabana-header h3 {
            font-size: clamp(2rem, 4vw, 2.8rem);
            color: var(--gold);
            margin: 0 0 20px 0;
            letter-spacing: -0.5px;
        }

        .pino-icon {
            font-size: 2.2rem;
            color: var(--gold);
            margin-bottom: 20px;
            opacity: 0.8;
        }

        .cabana-description {
            max-width: 800px;
            margin: 0 auto 30px;
            font-size: 1.1rem;
            line-height: 1.8;
            color: #d1dad5;
            font-weight: 300;
        }

        .cabana-gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 16px;
            padding: 0 40px 50px;
        }

        .cabana-gallery img {
            width: 100%;
            height: 240px;
            object-fit: cover;
            border-radius: 16px;
            transition: transform 0.4s, filter 0.4s;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .cabana-gallery img:hover {
            transform: scale(1.04);
            filter: brightness(1.05);
        }

        /* BOTONES PREMIUM */
        .btn-premium {
            padding: 14px 36px;
            text-decoration: none;
            border-radius: 50px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-size: 0.85rem;
            transition: all 0.4s ease;
            display: inline-block;
            cursor: pointer;
        }

        .btn-gold {
            background: var(--gold);
            color: var(--forest-dark);
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.3);
        }

        .btn-gold:hover {
            background: var(--text-light);
            color: var(--forest-dark);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255,255,255,0.2);
        }

        .btn-outline-gold {
            background: transparent;
            color: var(--gold);
            border: 2px solid var(--gold);
        }

        .btn-outline-gold:hover {
            background: var(--gold);
            color: var(--forest-dark);
            transform: translateY(-2px);
        }

        /* SECCIÓN EVENTOS */
        .grid-events {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
            margin-top: 20px;
        }

        .card-event {
            background: white;
            padding: 50px 40px;
            border-radius: 24px;
            text-align: center;
            box-shadow: var(--shadow-subtle);
            transition: all 0.4s ease;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            border: 1px solid rgba(0,0,0,0.02);
        }

        .card-event:hover {
            transform: translateY(-10px);
            box-shadow: 0 20px 40px rgba(17,27,21,0.08);
            border-bottom: 5px solid var(--gold);
        }

        .card-event i {
            font-size: 3.2rem;
            color: var(--forest-mid);
            margin-bottom: 25px;
        }

        .card-event h4 {
            font-family: 'Playfair Display', serif;
            font-size: 1.6rem;
            margin: 0 0 15px 0;
            color: var(--forest-dark);
        }

        /* SECCIÓN TOUR 360 */
        .tour-box {
            background: linear-gradient(rgba(17,27,21,0.85), rgba(17,27,21,0.95)), url('Fachada.jpg');
            background-size: cover;
            background-position: center;
            color: white;
            padding: 100px 40px;
            text-align: center;
            border-radius: 40px;
            margin: 60px 20px;
            box-shadow: var(--shadow-strong);
        }

        .tour-box h3 {
            font-size: 2.5rem;
            margin-bottom: 15px;
            color: var(--gold);
        }

        /* SECCIÓN AVENTURA */
        .adventure {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 60px;
            background: var(--wood-clear);
            padding: 60px;
            border-radius: 40px;
            box-shadow: var(--shadow-subtle);
        }

        .adventure-content {
            flex: 1;
            min-width: 300px;
        }

        .adventure-content h3 {
            font-size: 2.3rem;
            margin-top: 0;
            color: var(--forest-dark);
        }

        .adventure-img {
            flex: 1;
            min-width: 300px;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: var(--shadow-strong);
        }

        .adventure-img img {
